[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "logops"
version = "2.0.0.dev0"
description = "Deterministic, evidence-driven health auditing for SIEM detection rules (Splunk via MCP)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "typer>=0.12",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
logops = "logops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/logops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: requires a real Splunk MCP server (skipped unless -m live)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["archive", "splunk_agent.py", "ai_explainer.py", "app.py", "log_generator.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is owned by `ruff format`

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
